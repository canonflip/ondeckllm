<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnDeckLLM</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.jpg" class="brand-icon-img" alt="OnDeckLLM" style="width:28px;height:28px;border-radius:6px;">
        <span class="brand-text">OnDeckLLM</span>
        <span class="brand-version">v1.2</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#providers" class="nav-item active" data-page="providers">
          <span class="nav-icon">&#x2B22;</span>
          <span class="nav-label">Provider Hub</span>
        </a>
        <a href="#router" class="nav-item" data-page="router">
          <span class="nav-icon">&#x2116;</span>
          <span class="nav-label">Batting Order</span>
        </a>
        <a href="#ollama" class="nav-item" data-page="ollama">
          <span class="nav-icon">&#x2B07;</span>
          <span class="nav-label">Ollama Models</span>
        </a>
        <a href="#profiles" class="nav-item" data-page="profiles">
          <span class="nav-icon">&#x25CE;</span>
          <span class="nav-label">Profiles</span>
        </a>
        <a href="#support" class="nav-item" data-page="support">
          <span class="nav-icon">&#x2764;</span>
          <span class="nav-label">Support</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="status-dot active"></div>
        <span>localhost:3900</span>
      </div>
    </aside>
    <main class="main">
      <div id="welcome-banner"></div>
      <div id="page-providers" class="page active"></div>
      <div id="page-router" class="page"></div>
      <div id="page-ollama" class="page"></div>
      <div id="page-profiles" class="page"></div>
      <div id="page-support" class="page"></div>
    </main>
  </div>
  <div id="toast-container"></div>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
